upstream server_app {
    server 127.0.0.1:8000;
}

upstream ui_app {
    server 127.0.0.1:3000;
}

# HTTP (Port 80) -> Force Redirect to Secure HTTPS
server {
    listen 80;
    server_name xqpi.engr.colostate.edu;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (Port 443) -> Production Secure Reverse Proxy
server {
    listen 443 ssl default_server;
    server_name xqpi.engr.colostate.edu;
    server_tokens off;

    # Institutional DV SSL Security Certificates Mounted via Host
    ssl_certificate /etc/letsencrypt/live/xqpi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xqpi/privkey.pem;

    # SECURITY FIREWALL: Restrict access to CSU Networks Only
    allow 129.82.0.0/16;   # Whitelists all CSU Campus & VPN IP blocks
    allow 127.0.0.1;       # Whitelists the server's internal loopback
    # deny all;              # Instantly blocks everyone else with a 403 Forbidden

    # 1. Main Next.js Frontend Dashboard Interface
    location / {
        proxy_pass http://ui_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Weather Radar Plot Media Images (Direct stream from university disk storage)
    location ^~ /api/xbandRadarImages {
         proxy_pass http://ui_app;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_redirect off;
    }	

    # 3. Django API Backend Paths
    location /api/ {
        proxy_pass http://server_app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host localhost;
        proxy_set_header X-NginX-Proxy true;
        proxy_redirect off;
    }

    # 2b. Radar Map Image Data Assets (Routed through Next.js API App Router)
    location ^~ /api/imageData {
         proxy_pass http://ui_app;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_redirect off;
    }	

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}

