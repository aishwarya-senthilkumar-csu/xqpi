upstream server_app_sfbay {
    server server:8000;
}

upstream ui_app {    
    server ui:3000;  # Ensure 'ui' is reachable; check your Docker network setup
}

server {
    listen 443 ssl;
    server_name sfbay-dist.engr.colostate.edu;

    ssl_certificate /etc/letsencrypt/live/sfbay-dist.engr.colostate.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sfbay-dist.engr.colostate.edu/privkey.pem;


    # Serve the React UI for the main site
    location / {
        proxy_pass http://ui:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Send API calls to Django backend
    location /api/ {
        proxy_pass http://server_app_sfbay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}


